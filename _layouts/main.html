<!doctype html>
<html lang="{{ page.lang | default: site.lang | escape }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    {% feed_meta %}
    <link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link href="{{ '/stylesheets/styles.css' | relative_url }}" rel="stylesheet">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <div class="wrapper">
      <header class="site-header">
        <a class="site-name" href="{{ '/' | relative_url }}">Manoel Amaro</a>
        <p class="tagline">Software engineer<br>M.Sc. in Computer Science</p>
        <nav aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
          {% if site.posts.size > 0 %}
          <a href="{{ '/posts.html' | relative_url }}"{% if page.url == '/posts.html' %} aria-current="page"{% endif %}>Posts</a>
          {% endif %}
        </nav>
        {% include profiles.html %}
        {% include latest_posts.html %}
      </header>
      <main id="content" tabindex="-1">
        {{ content }}
      </main>
      <footer class="site-footer">
        <small>Built with Jekyll. Based on a theme by <a href="https://github.com/orderedlist">orderedlist</a>.</small>
        <a href="{{ '/feed.xml' | relative_url }}">RSS feed</a>
      </footer>
    </div>
  </body>
</html>
