---
layout: main
---
<article>
  <header class="post-header">
    <p class="eyebrow">Notes</p>
    <h1>{{ page.title | escape }}</h1>
    <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date_to_long_string }}</time>{% if page.tags.size > 0 %} · {{ page.tags | array_to_sentence_string | escape }}{% endif %}</p>
  </header>
  <div class="post-content">{{ content }}</div>
</article>
<p><a href="{{ '/posts.html' | relative_url }}">All posts</a></p>
